name: Discord announce

on:
  workflow_dispatch:
    inputs:
      version:
        description: Changelog version to post (blank posts a connection test)
        required: false
        default: ""

jobs:
  post:
    name: Post to Discord
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RENIUM_VERSION: ${{ github.event.inputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is empty; set it with: gh secret set DISCORD_WEBHOOK_URL" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, os, re, sys, urllib.request
          version = os.environ["RENIUM_VERSION"].strip()
          if version:
              changelog = open("tools/renium-vscode-extension/changelog.md", encoding="utf-8").read()
              match = re.search(rf"^## {re.escape(version)}\b[^\n]*\n(.*?)(?=^## |\Z)", changelog, re.S | re.M)
              if not match:
                  sys.exit(f"changelog has no entry for {version}")
              text = f"# {version}\n\n{match.group(1).strip()}\n\n{os.environ['RELEASE_URL']}/v{version}\n"
          else:
              text = "Renium release announcements are connected."
          chunks, current = [], ""
          for line in text.splitlines(keepends=True):
              if len(current) + len(line) > 1900 and current:
                  chunks.append(current)
                  current = ""
              current += line
          if current.strip():
              chunks.append(current)
          for chunk in chunks:
              body = json.dumps({"content": chunk, "allowed_mentions": {"parse": []}}).encode()
              request = urllib.request.Request(
                  os.environ["DISCORD_WEBHOOK_URL"].strip().strip("'\""),
                  data=body,
                  headers={"Content-Type": "application/json", "User-Agent": "renium-release"},
              )
              with urllib.request.urlopen(request) as response:
                  response.read()
          print(f"posted {len(chunks)} message(s)")
          PY

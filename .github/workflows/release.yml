name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      # A release comes only from a tag signed with the maintainer's key.
      - name: Verify the tag signature
        run: |
          git config gpg.ssh.allowedSignersFile .github/allowed_signers
          git verify-tag "${{ github.ref_name }}"

      - id: version
        shell: pwsh
        run: |
          $manifest = Get-Content tools/renium/Cargo.toml -Raw
          $match = [regex]::Match($manifest, '(?m)^version\s*=\s*"(?<version>[^"]+)"\s*$')
          if (-not $match.Success) { throw "Could not read the Renium version" }
          $version = $match.Groups["version"].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match version $version"
          }
          $package = Get-Content tools/renium-vscode-extension/package.json -Raw | ConvertFrom-Json
          if ([string]$package.version -ne $version) { throw "Extension version does not match $version" }
          $runtime = Get-Content tools/plugin_ws_bridge/BridgePluginRuntime.module.luau -Raw
          if ($runtime -notmatch ('BRIDGE_VERSION\s*=\s*"' + [regex]::Escape($version) + '"')) {
            throw "Studio plugin version does not match $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

  quality:
    name: Rust format and lints
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/renium

      - name: Check Rust quality
        run: |
          cargo fmt --manifest-path tools/renium/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tools/renium/Cargo.toml --all-targets -- -D warnings -D clippy::cognitive_complexity -D clippy::too_many_arguments

  cli:
    name: CLI (${{ matrix.os }})
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every CLI build runs on the maintainer's own runners, whose target
          # directories persist between runs. The ARM64 builds are
          # cross-compiled: Windows ARM64 on the Windows runner (build only,
          # nothing there can run ARM64 code), Linux ARM64 on the Linux runner
          # with its tests under QEMU, and Intel macOS on the Apple Silicon
          # runner with its tests under Rosetta.
          - os: windows-x64
            runner: '["self-hosted", "Windows", "X64"]'
            hosted: false
            platform: windows-x64
            artifact: cli-Windows-X64
          - os: windows-arm64
            runner: '["self-hosted", "Windows", "X64"]'
            hosted: false
            target: aarch64-pc-windows-msvc
            skip_tests: true
            platform: windows-arm64
            artifact: cli-Windows-ARM64
          - os: linux-x64
            runner: '["self-hosted", "Linux", "X64"]'
            hosted: false
            platform: linux-x64
            artifact: cli-Linux-X64
          - os: linux-arm64
            runner: '["self-hosted", "Linux", "X64"]'
            hosted: false
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            artifact: cli-Linux-ARM64
          - os: macos-arm64
            runner: '["self-hosted", "macOS", "ARM64"]'
            hosted: false
            platform: macos-arm64
            artifact: cli-macOS-ARM64
          - os: macos-x64
            runner: '["self-hosted", "macOS", "ARM64"]'
            hosted: false
            target: x86_64-apple-darwin
            platform: macos-x64
            artifact: cli-macOS-X64
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 30
    env:
      RENIUM_UPDATE_PUBLIC_KEY: ${{ vars.RENIUM_UPDATE_PUBLIC_KEY }}
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      # A self-hosted runner keeps its target directory between runs; the
      # checkout must not clean it away.
      - uses: actions/checkout@v6
        with:
          clean: ${{ matrix.hosted }}

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: matrix.hosted
        with:
          workspaces: tools/renium

      # ring compiles its C sources for Windows ARM64 with clang, which finds
      # the C runtime headers and libraries only through the MSVC cross
      # environment; cl.exe and link.exe come from the same Build Tools.
      - name: Import the MSVC ARM64 cross environment
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $vs) { throw "No Visual Studio instance with the MSVC ARM64 build tools was found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          $lines = cmd /c "`"$vcvars`" x64_arm64 >nul 2>&1 && set"
          foreach ($line in $lines) {
            if ($line -match '^(INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion)=(.*)$') {
              "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV
            }
          }

      - name: Test and build
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          # Paths of the build machine never reach the binary or the logs.
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME ".cargo" }
          $env:RUSTFLAGS = "--remap-path-prefix=$cargoHome=/cargo --remap-path-prefix=$PWD=/renium --remap-path-prefix=$HOME=/home"
          $target = "${{ matrix.target }}"
          $targetArgs = if ($target) { @("--target", $target) } else { @() }
          if ("${{ matrix.skip_tests }}" -ne "true") {
            cargo test --locked --release --manifest-path tools/renium/Cargo.toml @targetArgs
          }
          cargo build --locked --release --manifest-path tools/renium/Cargo.toml @targetArgs
          $binaryDir = if ($target) { "tools/renium/target/$target/release" } else { "tools/renium/target/release" }
          "RENIUM_BINARY_DIR=$binaryDir" >> $env:GITHUB_ENV

      - name: Package CLI
        shell: pwsh
        run: |
          $version = "${{ needs.verify-tag.outputs.version }}"
          $platform = "${{ matrix.platform }}"
          $stage = Join-Path $env:RUNNER_TEMP "renium-$version-$platform"
          New-Item -ItemType Directory -Path $stage | Out-Null
          $binary = if ("${{ runner.os }}" -eq "Windows") { "renium.exe" } else { "renium" }
          Copy-Item (Join-Path $env:RENIUM_BINARY_DIR $binary) $stage
          Copy-Item tools/renium/renium-agents.md $stage
          Copy-Item tools/renium/renium-guides $stage -Recurse
          $readme = (Get-Content tools/renium/RELEASE_README.md -Raw).Replace("{{VERSION}}", $version)
          [IO.File]::WriteAllText(
            (Join-Path $stage "README.md"),
            $readme,
            [Text.UTF8Encoding]::new($false)
          )
          Copy-Item LICENSE $stage
          if ("${{ runner.os }}" -eq "Windows") {
            Copy-Item rbx.cmd $stage
            Copy-Item install.ps1 $stage
            ./tools/build-windows-launcher.ps1 `
              -InstallerScript (Join-Path $stage "install.ps1") `
              -Version $version `
              -OutputPath (Join-Path $stage "Install Renium.cmd")
          }
          else {
            Copy-Item rbx $stage
            Copy-Item install.sh $stage
            chmod +x (Join-Path $stage "renium") (Join-Path $stage "rbx") (Join-Path $stage "install.sh")
            if ("${{ runner.os }}" -eq "macOS") {
              Copy-Item tools/renium/install-macos.command (Join-Path $stage "Install Renium.command")
              chmod +x (Join-Path $stage "Install Renium.command")
            }
          }
          $archive = Join-Path $env:RUNNER_TEMP "renium-$version-$platform.zip"
          if ("${{ runner.os }}" -eq "Windows") {
            Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive
          }
          else {
            Push-Location $stage
            try { zip -q -r $archive . }
            finally { Pop-Location }
          }
          "RENIUM_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.RENIUM_ARCHIVE }}
          if-no-files-found: error

      - uses: actions/attest@v4
        with:
          subject-path: ${{ env.RENIUM_ARCHIVE }}

  integration:
    name: Plugin and extension
    needs: [verify-tag, cli]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RENIUM_UPDATE_PUBLIC_KEY: ${{ vars.RENIUM_UPDATE_PUBLIC_KEY }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/renium

      - uses: ok-nick/setup-aftman@e226f24209f47677da7b215bab44f6351a2c043b
        with:
          version: v0.3.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/renium-vscode-extension/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: cli-Windows-X64
          path: cli-artifact

      - name: Build release components
        run: |
          $archive = Get-ChildItem cli-artifact -Recurse -File -Filter *.zip | Select-Object -First 1
          if ($null -eq $archive) { throw "Windows x64 CLI artifact is missing" }
          $cliStage = Join-Path $env:RUNNER_TEMP "renium-integration-cli"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $cliStage
          $cli = Get-ChildItem $cliStage -Recurse -File -Filter renium.exe | Select-Object -First 1
          if ($null -eq $cli) { throw "Windows x64 CLI binary is missing" }
          $output = Join-Path $env:RUNNER_TEMP "release-output"
          ./tools/build-release.ps1 `
            -OutputDirectory $output `
            -AllowLocalPublisher `
            -PrebuiltCli $cli.FullName
          $release = Join-Path $output "renium-${{ needs.verify-tag.outputs.version }}"
          if (-not (Test-Path $release -PathType Container)) { throw "Release directory was not produced" }
          $shared = Join-Path $env:RUNNER_TEMP "renium-shared"
          New-Item -ItemType Directory -Path $shared | Out-Null
          $plugin = Join-Path $release "Renium.rbxm"
          if (-not (Test-Path -LiteralPath $plugin -PathType Leaf)) {
            throw "Release directory is missing Renium.rbxm"
          }
          Copy-Item -LiteralPath $plugin -Destination $shared
          Copy-Item `
            -LiteralPath (Join-Path $release "Install Renium.cmd") `
            -Destination (Join-Path $shared "Install-Renium.cmd")
          "RENIUM_SHARED_DIR=$shared" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: integration
          path: ${{ env.RENIUM_SHARED_DIR }}
          if-no-files-found: error

  extension:
    name: Extension (${{ matrix.target }})
    needs: [verify-tag, cli, integration]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cliArtifact: cli-Windows-X64
            target: win32-x64
            binary: renium.exe
          - os: windows-11-arm
            cliArtifact: cli-Windows-ARM64
            target: win32-arm64
            binary: renium.exe
          - os: ubuntu-latest
            cliArtifact: cli-Linux-X64
            target: linux-x64
            binary: renium
          - os: ubuntu-24.04-arm
            cliArtifact: cli-Linux-ARM64
            target: linux-arm64
            binary: renium
          - os: macos-latest
            cliArtifact: cli-macOS-ARM64
            target: darwin-arm64
            binary: renium
          - os: macos-15-intel
            cliArtifact: cli-macOS-X64
            target: darwin-x64
            binary: renium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/renium-vscode-extension/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: integration
          path: integration-artifact

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.cliArtifact }}
          path: cli-artifact

      - name: Prepare matching plugin and CLI
        shell: pwsh
        run: |
          $plugin = Get-ChildItem integration-artifact -Recurse -File -Filter Renium.rbxm | Select-Object -First 1
          if ($null -eq $plugin) { throw "Integration artifact is missing Renium.rbxm" }
          Copy-Item -LiteralPath $plugin.FullName -Destination tools/plugin_ws_bridge/Renium.rbxm -Force
          Copy-Item -LiteralPath $plugin.FullName -Destination tools/renium-vscode-extension/assets/Renium.rbxm -Force
          "RENIUM_PLUGIN_BUNDLE=$($plugin.FullName)" >> $env:GITHUB_ENV
          $archive = Get-ChildItem cli-artifact -Recurse -File -Filter *.zip | Select-Object -First 1
          if ($null -eq $archive) { throw "CLI artifact is missing its archive" }
          $stage = Join-Path $env:RUNNER_TEMP "renium-cli"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $stage
          $cli = Get-ChildItem $stage -Recurse -File -Filter "${{ matrix.binary }}" | Select-Object -First 1
          if ($null -eq $cli) { throw "CLI archive is missing ${{ matrix.binary }}" }
          if ("${{ runner.os }}" -ne "Windows") { chmod +x $cli.FullName }
          "RENIUM_CLI_BUILD=$($cli.FullName)" >> $env:GITHUB_ENV

      - name: Package extension
        shell: pwsh
        run: |
          npm ci --prefix tools/renium-vscode-extension
          $output = Join-Path $env:RUNNER_TEMP "renium-${{ needs.verify-tag.outputs.version }}-${{ matrix.target }}.vsix"
          Push-Location tools/renium-vscode-extension
          try {
            npx --no-install vsce package --target "${{ matrix.target }}" --out $output
          }
          finally {
            Pop-Location
          }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw "VSIX was not produced" }
          "RENIUM_VSIX=$output" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.target }}
          path: ${{ env.RENIUM_VSIX }}
          if-no-files-found: error

      - uses: actions/attest@v4
        with:
          subject-path: ${{ env.RENIUM_VSIX }}

  publish:
    name: Publish GitHub release
    needs: [verify-tag, quality, cli, integration, extension]
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release assets
        run: |
          mkdir release-assets
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [ -e "release-assets/$name" ]; then
              echo "Duplicate release asset name: $name" >&2
              exit 1
            fi
            cp "$file" "release-assets/$name"
          done < <(find artifacts -type f -print0)

      - name: Generate signed update manifest
        env:
          RENIUM_UPDATE_PRIVATE_KEY: ${{ secrets.RENIUM_UPDATE_PRIVATE_KEY }}
          RENIUM_UPDATE_PUBLIC_KEY: ${{ vars.RENIUM_UPDATE_PUBLIC_KEY }}
        run: |
          node tools/generate-update-manifest.mjs \
            release-assets \
            "${{ needs.verify-tag.outputs.version }}" \
            "${{ github.repository }}" \
            release-assets/update-manifest.json

      - uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Prepare release notes
        env:
          RENIUM_VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          {
            awk -v heading="## $RENIUM_VERSION" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
              END { if (!found) exit 1 }
            ' tools/renium-vscode-extension/changelog.md
            printf '%s\n\n' '### Install'
            printf '%s\n' 'On Windows, download and double-click **Install-Renium.cmd**; it selects the correct x64 or ARM64 package automatically. On macOS, extract the platform ZIP and double-click **Install Renium.command**. The installer asks which detected editor should receive the extension and puts `renium` on your PATH.'
          } > /tmp/renium-release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' files < <(find release-assets -maxdepth 1 -type f -print0)
          if gh release view "${{ github.ref_name }}" --json isDraft >/tmp/renium-release.json 2>/dev/null; then
            if [ "$(jq -r .isDraft /tmp/renium-release.json)" != "true" ]; then
              echo "Refusing to modify the published release ${{ github.ref_name }}" >&2
              exit 1
            fi
          else
            gh release create "${{ github.ref_name }}" --verify-tag --draft
          fi
          gh release edit "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/renium-release-notes.md
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/renium-expected-assets
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' | sort > /tmp/renium-uploaded-assets
          if ! cmp -s /tmp/renium-expected-assets /tmp/renium-uploaded-assets; then
            echo "Draft release assets do not match the verified release set" >&2
            diff -u /tmp/renium-expected-assets /tmp/renium-uploaded-assets || true
            exit 1
          fi
          gh release edit "${{ github.ref_name }}" --draft=false

      - name: Announce on Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RENIUM_VERSION: ${{ needs.verify-tag.outputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping the announcement"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          notes = open("/tmp/renium-release-notes.md", encoding="utf-8").read().split("### Install")[0].strip()
          text = f"# {os.environ['RENIUM_VERSION']}\n\n{notes}\n\n{os.environ['RELEASE_URL']}\n"
          chunks, current = [], ""
          for line in text.splitlines(keepends=True):
              if len(current) + len(line) > 1900 and current:
                  chunks.append(current)
                  current = ""
              current += line
          if current.strip():
              chunks.append(current)
          for chunk in chunks:
              body = json.dumps({"content": chunk, "allowed_mentions": {"parse": []}}).encode()
              request = urllib.request.Request(
                  os.environ["DISCORD_WEBHOOK_URL"].strip().strip("'\""),
                  data=body,
                  headers={"Content-Type": "application/json", "User-Agent": "renium-release"},
              )
              with urllib.request.urlopen(request) as response:
                  response.read()
          print(f"posted {len(chunks)} message(s) to Discord")
          PY

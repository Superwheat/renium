name: Verify

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust format and lints
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/renium

      - name: Check formatting
        run: |
          cargo fmt --manifest-path tools/renium/Cargo.toml -- --check

      - name: Run Clippy
        run: |
          cargo clippy --locked --manifest-path tools/renium/Cargo.toml --all-targets -- -D warnings -D clippy::cognitive_complexity -D clippy::too_many_arguments

  rust-cross-platform:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-11-arm]
    # Linux x64 and macOS tests for maintainer pushes run on the maintainer's
    # own machines; pull requests never reach them.
    runs-on: ${{ github.event_name == 'push' && matrix.os == 'macos-latest' && fromJSON('["self-hosted", "macOS", "ARM64"]') || github.event_name == 'push' && matrix.os == 'ubuntu-latest' && fromJSON('["self-hosted", "Linux", "X64"]') || matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        if: ${{ !(github.event_name == 'push' && (matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest')) }}
        with:
          workspaces: |
            tools/renium
            tools/renium-plugin-sdk
            tools/vendor/rbx-dom

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Run CLI tests
        run: cargo test --locked --manifest-path tools/renium/Cargo.toml

      - name: Run plugin SDK tests
        run: cargo test --locked --manifest-path tools/renium-plugin-sdk/Cargo.toml

      - name: Run vendored rbx-dom tests
        run: cargo test --locked --manifest-path tools/vendor/rbx-dom/Cargo.toml -p rbx_binary -p rbx_xml -p rbx_dom_weak -p rbx_types -p rbx_reflection -p rbx_reflection_database

      - name: Test launchers
        run: node tools/renium/tests/launcher-smoke.mjs

      - name: Test package subobjects
        run: node tools/renium/tests/package-subobject.mjs

  build-and-test:
    name: Windows release build and extension
    # Pushes by maintainers build on the maintainer's own runner, whose target
    # directory persists between runs; pull requests never reach that machine.
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted", "Windows", "X64"]') || 'windows-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'push'
        with:
          workspaces: tools/renium

      # The maintainer's runner carries its own rojo and lune; aftman would
      # install into the user profile instead.
      - uses: ok-nick/setup-aftman@e226f24209f47677da7b215bab44f6351a2c043b
        if: github.event_name != 'push'
        with:
          version: v0.3.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/renium-vscode-extension/package-lock.json

      - name: Build and test the CLI
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Paths of the build machine never reach the binary or the logs.
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME ".cargo" }
          $env:RUSTFLAGS = "--remap-path-prefix=$cargoHome=/cargo --remap-path-prefix=$PWD=/renium --remap-path-prefix=$HOME=/home"
          # Verification builds skip LTO; the Release workflow builds and
          # tests the optimized profile on every platform.
          cargo build --locked --profile fast --manifest-path tools/renium/Cargo.toml
          cargo test --locked --profile fast --manifest-path tools/renium/Cargo.toml
          node tools/renium/tests/automation-replay.mjs tools/renium/target/fast/renium.exe
          node tools/renium-vscode-extension/scripts/sync-assets.mjs --docs-only
          node tools/renium/tests/agent-docs-smoke.mjs tools/renium/target/fast/renium.exe
          node tools/renium/tests/launcher-smoke.mjs
          "RENIUM_CLI_BUILD=$(Join-Path $PWD 'tools/renium/target/fast/renium.exe')" >> $env:GITHUB_ENV

      - name: Build both Studio plugin formats
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $pluginXml = Join-Path $env:RUNNER_TEMP "Renium.rbxmx"
          $pluginBinary = Join-Path $env:RUNNER_TEMP "Renium.rbxm"
          rojo build tools/plugin_ws_bridge/Renium.project.json --output $pluginXml
          rojo build tools/plugin_ws_bridge/Renium.project.json --output $pluginBinary
          if ((Get-Item -LiteralPath $pluginXml).Length -lt 128) { throw "Rojo produced an unexpectedly small XML plugin" }
          if ((Get-Item -LiteralPath $pluginBinary).Length -lt 16) { throw "Rojo produced an unexpectedly small binary plugin" }
          if (-not ([IO.File]::ReadAllText($pluginXml).Contains("<roblox"))) { throw "The XML plugin is not a Roblox model" }
          Copy-Item -LiteralPath $pluginBinary -Destination tools/renium-vscode-extension/assets/Renium.rbxm -Force

      - name: Test Studio plugin modules
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & tools/plugin_ws_bridge/tests/parse-all.ps1
          lune run tools/plugin_ws_bridge/tests/run

      - name: Install, test, and package the extension
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm.cmd ci --prefix tools/renium-vscode-extension
          npm.cmd --prefix tools/renium-vscode-extension run verify
          $vsix = Join-Path $env:RUNNER_TEMP "renium-ci.vsix"
          $env:RENIUM_PLUGIN_BUNDLE = Join-Path $env:RUNNER_TEMP "Renium.rbxm"
          Push-Location tools/renium-vscode-extension
          try {
            npx.cmd --no-install vsce package --out $vsix
          }
          finally {
            Pop-Location
          }
          if (-not (Test-Path -LiteralPath $vsix -PathType Leaf)) { throw "VSIX was not produced" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($vsix)
          try {
            if ($null -eq $archive.GetEntry("extension/package.json")) { throw "VSIX is missing extension/package.json" }
            $pluginEntry = $archive.GetEntry("extension/assets/Renium.rbxm")
            if ($null -eq $pluginEntry) { throw "VSIX is missing its matching Studio plugin" }
            $cliEntry = $archive.GetEntry("extension/bin/win32-x64/renium.exe")
            if ($null -eq $cliEntry) { throw "VSIX is missing its matching Renium CLI" }
            if ($null -eq $archive.GetEntry("extension/bin/win32-x64/renium-agents.md")) {
              throw "VSIX is missing the Renium agent instructions"
            }
            if ($null -eq $archive.GetEntry("extension/bin/win32-x64/renium-guides/advanced.md")) {
              throw "VSIX is missing the Renium agent topic guides"
            }
            if ($null -eq $archive.GetEntry("extension/resources/RENIUM/opencloud.md")) {
              throw "VSIX is missing its generated Renium topic guides"
            }
            $stream = $pluginEntry.Open()
            $sha256 = [Security.Cryptography.SHA256]::Create()
            try {
              $packagedPluginHash = [BitConverter]::ToString($sha256.ComputeHash($stream)).Replace("-", "").ToLowerInvariant()
            }
            finally {
              $sha256.Dispose()
              $stream.Dispose()
            }
            $expectedPluginHash = (Get-FileHash -LiteralPath (Join-Path $env:RUNNER_TEMP "Renium.rbxm") -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($packagedPluginHash -ne $expectedPluginHash) { throw "VSIX plugin does not match the built Studio plugin" }
            $cliStream = $cliEntry.Open()
            $cliSha256 = [Security.Cryptography.SHA256]::Create()
            try {
              $packagedCliHash = [BitConverter]::ToString($cliSha256.ComputeHash($cliStream)).Replace("-", "").ToLowerInvariant()
            }
            finally {
              $cliSha256.Dispose()
              $cliStream.Dispose()
            }
            $expectedCliHash = (Get-FileHash -LiteralPath "tools/renium/target/fast/renium.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($packagedCliHash -ne $expectedCliHash) { throw "VSIX CLI does not match the built Renium CLI" }
          }
          finally {
            $archive.Dispose()
          }

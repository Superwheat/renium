name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - id: version
        shell: pwsh
        run: |
          $manifest = Get-Content tools/renium/Cargo.toml -Raw
          $match = [regex]::Match($manifest, '(?m)^version\s*=\s*"(?<version>[^"]+)"\s*$')
          if (-not $match.Success) { throw "Could not read the Renium version" }
          $version = $match.Groups["version"].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match version $version"
          }
          $package = Get-Content tools/renium-vscode-extension/package.json -Raw | ConvertFrom-Json
          if ([string]$package.version -ne $version) { throw "Extension version does not match $version" }
          $runtime = Get-Content tools/plugin_ws_bridge/BridgePluginRuntime.module.lua -Raw
          if ($runtime -notmatch ('BRIDGE_VERSION\s*=\s*"' + [regex]::Escape($version) + '"')) {
            throw "Studio plugin version does not match $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

  cli:
    name: CLI (${{ matrix.os }})
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RENIUM_UPDATE_PUBLIC_KEY: ${{ vars.RENIUM_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt

      - name: Test and build
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          cargo fmt --manifest-path tools/renium/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tools/renium/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --release --manifest-path tools/renium/Cargo.toml
          cargo build --locked --release --manifest-path tools/renium/Cargo.toml

      - name: Package CLI
        shell: pwsh
        run: |
          $version = "${{ needs.verify-tag.outputs.version }}"
          $platform = "${{ runner.os }}-${{ runner.arch }}".ToLowerInvariant()
          $stage = Join-Path $env:RUNNER_TEMP "renium-$version-$platform"
          New-Item -ItemType Directory -Path $stage | Out-Null
          $binary = if ("${{ runner.os }}" -eq "Windows") { "renium.exe" } else { "renium" }
          Copy-Item "tools/renium/target/release/$binary" $stage
          Copy-Item tools/renium/README.md (Join-Path $stage "README.md")
          Copy-Item LICENSE $stage
          if ("${{ runner.os }}" -eq "Windows") {
            Copy-Item rbx.cmd $stage
            Copy-Item tools/renium/rbx-run.ps1 $stage
            Copy-Item install.ps1 $stage
          }
          else {
            Copy-Item rbx $stage
            Copy-Item install.sh $stage
          }
          $archive = Join-Path $env:RUNNER_TEMP "renium-$version-$platform.zip"
          Compress-Archive -LiteralPath $stage -DestinationPath $archive
          "RENIUM_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.RENIUM_ARCHIVE }}
          if-no-files-found: error

      - uses: actions/attest@v4
        with:
          subject-path: ${{ env.RENIUM_ARCHIVE }}

  integration:
    name: Plugin and extension
    needs: verify-tag
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RENIUM_UPDATE_PUBLIC_KEY: ${{ vars.RENIUM_UPDATE_PUBLIC_KEY }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: ok-nick/setup-aftman@e226f24209f47677da7b215bab44f6351a2c043b
        with:
          version: v0.3.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/renium-vscode-extension/package-lock.json

      - name: Build release components
        run: |
          $output = Join-Path $env:RUNNER_TEMP "release-output"
          ./tools/build-release.ps1 -OutputDirectory $output -AllowLocalPublisher
          $release = Join-Path $output "renium-${{ needs.verify-tag.outputs.version }}"
          if (-not (Test-Path $release -PathType Container)) { throw "Release directory was not produced" }
          $shared = Join-Path $env:RUNNER_TEMP "renium-shared"
          New-Item -ItemType Directory -Path $shared | Out-Null
          @(
            "Renium.rbxm",
            "Renium.rbxmx"
          ) | ForEach-Object {
            $source = Join-Path $release $_
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Release directory is missing $_"
            }
            Copy-Item -LiteralPath $source -Destination $shared
          }
          "RENIUM_SHARED_DIR=$shared" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: integration
          path: ${{ env.RENIUM_SHARED_DIR }}
          if-no-files-found: error

  extension:
    name: Extension (${{ matrix.target }})
    needs: [verify-tag, cli, integration]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cliArtifact: cli-Windows-X64
            target: win32-x64
            binary: renium.exe
          - os: windows-11-arm
            cliArtifact: cli-Windows-ARM64
            target: win32-arm64
            binary: renium.exe
          - os: ubuntu-latest
            cliArtifact: cli-Linux-X64
            target: linux-x64
            binary: renium
          - os: ubuntu-24.04-arm
            cliArtifact: cli-Linux-ARM64
            target: linux-arm64
            binary: renium
          - os: macos-latest
            cliArtifact: cli-macOS-ARM64
            target: darwin-arm64
            binary: renium
          - os: macos-15-intel
            cliArtifact: cli-macOS-X64
            target: darwin-x64
            binary: renium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/renium-vscode-extension/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: integration
          path: integration-artifact

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.cliArtifact }}
          path: cli-artifact

      - name: Prepare matching plugin and CLI
        shell: pwsh
        run: |
          $plugin = Get-ChildItem integration-artifact -Recurse -File -Filter Renium.rbxm | Select-Object -First 1
          if ($null -eq $plugin) { throw "Integration artifact is missing Renium.rbxm" }
          Copy-Item -LiteralPath $plugin.FullName -Destination tools/plugin_ws_bridge/Renium.rbxm -Force
          Copy-Item -LiteralPath $plugin.FullName -Destination tools/renium-vscode-extension/assets/Renium.rbxm -Force
          "RENIUM_PLUGIN_BUNDLE=$($plugin.FullName)" >> $env:GITHUB_ENV
          $archive = Get-ChildItem cli-artifact -Recurse -File -Filter *.zip | Select-Object -First 1
          if ($null -eq $archive) { throw "CLI artifact is missing its archive" }
          $stage = Join-Path $env:RUNNER_TEMP "renium-cli"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $stage
          $cli = Get-ChildItem $stage -Recurse -File -Filter "${{ matrix.binary }}" | Select-Object -First 1
          if ($null -eq $cli) { throw "CLI archive is missing ${{ matrix.binary }}" }
          if ("${{ runner.os }}" -ne "Windows") { chmod +x $cli.FullName }
          "RENIUM_CLI_BUILD=$($cli.FullName)" >> $env:GITHUB_ENV

      - name: Package extension
        shell: pwsh
        run: |
          npm ci --prefix tools/renium-vscode-extension
          $output = Join-Path $env:RUNNER_TEMP "renium-${{ needs.verify-tag.outputs.version }}-${{ matrix.target }}.vsix"
          Push-Location tools/renium-vscode-extension
          try {
            npx --no-install vsce package --target "${{ matrix.target }}" --out $output
          }
          finally {
            Pop-Location
          }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw "VSIX was not produced" }
          "RENIUM_VSIX=$output" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.target }}
          path: ${{ env.RENIUM_VSIX }}
          if-no-files-found: error

      - uses: actions/attest@v4
        with:
          subject-path: ${{ env.RENIUM_VSIX }}

  sbom:
    name: Software bill of materials
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: renium.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: renium.spdx.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [verify-tag, cli, integration, extension, sbom]
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release assets
        run: |
          mkdir release-assets
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [ -e "release-assets/$name" ]; then
              echo "Duplicate release asset name: $name" >&2
              exit 1
            fi
            cp "$file" "release-assets/$name"
          done < <(find artifacts -type f -print0)

      - name: Generate signed update manifest
        env:
          RENIUM_UPDATE_PRIVATE_KEY: ${{ secrets.RENIUM_UPDATE_PRIVATE_KEY }}
          RENIUM_UPDATE_PUBLIC_KEY: ${{ vars.RENIUM_UPDATE_PUBLIC_KEY }}
        run: |
          node tools/generate-update-manifest.mjs \
            release-assets \
            "${{ needs.verify-tag.outputs.version }}" \
            "${{ github.repository }}" \
            release-assets/update-manifest.json

      - name: Generate checksums
        run: |
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum \
              > SHA256SUMS.txt
          )

      - uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - uses: actions/attest@v4
        with:
          subject-path: release-assets/*
          sbom-path: release-assets/renium.spdx.json

      - name: Prepare release notes
        env:
          RENIUM_VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          {
            printf "# What's Changed\n"
            awk -v heading="## $RENIUM_VERSION" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
              END { if (!found) exit 1 }
            ' tools/renium-vscode-extension/changelog.md
          } > /tmp/renium-release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' files < <(find release-assets -maxdepth 1 -type f -print0)
          if gh release view "${{ github.ref_name }}" --json isDraft >/tmp/renium-release.json 2>/dev/null; then
            if [ "$(jq -r .isDraft /tmp/renium-release.json)" != "true" ]; then
              echo "Refusing to modify the published release ${{ github.ref_name }}" >&2
              exit 1
            fi
          else
            gh release create "${{ github.ref_name }}" --verify-tag --draft
          fi
          gh release edit "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/renium-release-notes.md
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/renium-expected-assets
          gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' | sort > /tmp/renium-uploaded-assets
          if ! cmp -s /tmp/renium-expected-assets /tmp/renium-uploaded-assets; then
            echo "Draft release assets do not match the verified release set" >&2
            diff -u /tmp/renium-expected-assets /tmp/renium-uploaded-assets || true
            exit 1
          fi
          gh release edit "${{ github.ref_name }}" --draft=false

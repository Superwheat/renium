[package]
name = "renium-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license-file = "../../../LICENSE"
description = "Exclusive disposable Studio places for Renium tasks"

# Deliberately not a member of Renium's build; build and qualify this plugin separately.
[workspace]

[dependencies]
renium-plugin-sdk = { path = "../../renium-plugin-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "=2.10.1", features = ["json"] }
url = "=2.4.1"

[profile.release]
lto = "thin"
codegen-units = 16
